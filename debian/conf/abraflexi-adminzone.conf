# abraflexi-adminzone default Apache configuration

Alias /abraflexi-adminzone /usr/share/abraflexi-adminzone

<Directory /usr/share/abraflexi-adminzone/>
	Options FollowSymLinks
	DirectoryIndex index.php
	Require all granted

	<IfModule mod_php.c>
		php_admin_flag allow_url_fopen Off
		php_admin_value open_basedir /usr/share/abraflexi-adminzone/:/usr/share/php/:/usr/share/javascript/:/etc/abraflexi-admin-zone/:/usr/share/locale/:/usr/share/doc/abraflexi-adminzone/:/var/lib/abraflexi-adminzone/:/var/cache/abraflexi-adminzone/:/var/tmp:/tmp
	</IfModule>

	<IfModule mod_deflate.c>
		AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/javascript application/json
	</IfModule>
</Directory>
